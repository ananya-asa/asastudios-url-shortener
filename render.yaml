services:
  - type: web
    name: asa-studios-url-shortener
    runtime: docker
    plan: free
    region: oregon
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: asa-studios-url-shortener-db
          property: connectionString
      - key: PUBLIC_BASE_URL
        fromService:
          type: web
          name: asa-studios-url-shortener
          envVarKey: RENDER_EXTERNAL_URL

databases:
  - name: asa-studios-url-shortener-db
    databaseName: url_shortener
    user: url_shortener
    plan: free
    region: oregon
